<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      ul {
        padding-left: 1.5em;
        margin-bottom: 1.5em;
      }
      li {
        margin-bottom: 0.9em;
        padding: 0.7em 1em;
        background: #f8f8fc;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        list-style-type: disc;
        font-size: 1.25em;
      }
      a {
        color: #2a4d8f;
        text-decoration: underline;
        font-size: 1.18em;
        padding: 0.3em 0.2em;
        display: inline-block;
      }
      h1, h2, h3 {
        margin-top: 1.5em;
        margin-bottom: 0.7em;
        font-family: inherit;
      }
      body {
        font-size: 1.15em;
      }
    </style>
</head>
<body>
  <div id="readme-content">Loading...</div>
  <script>
    fetch('README.md')
      .then(response => response.text())
      .then(md => {
        // Basic markdown to HTML conversion (headings, links, lists)
        let html = md
          .replace(/^# (.*$)/gim, '<h1>$1</h1>')
          .replace(/^## (.*$)/gim, '<h2>$1</h2>')
          .replace(/^### (.*$)/gim, '<h3>$1</h3>')
          .replace(/\*\*(.*)\*\*/gim, '<b>$1</b>')
          .replace(/\*(.*)\*/gim, '<i>$1</i>')
          .replace(/\[(.*?)\]\((.*?)\)/gim, '<a href="$2">$1</a>')
          .replace(/^\- (.*$)/gim, '<li>$1</li>')
          .replace(/<li>([\s\S]*?)<\/li>/gim, '<ul><li>$1</li></ul>')
          .replace(/\n/g, '<br>');
        document.getElementById('readme-content').innerHTML = html;
      });
  </script>
</body>
</html>
